name: build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk NoAdClicker-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: NoAdClicker-apk, path: 'NoAdClicker-*.apk' }
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "build-${{ github.run_number }}" NoAdClicker-*.apk --title "NoAdClicker build ${{ github.run_number }}" --notes "Auto build from ${{ github.sha }}"
